name: Backend CI

on:
  pull_request:
  push: {}

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  quality:
    name: Format, lint, typecheck, unit, build, OpenAPI
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrations:check
      - run: pnpm build
      - run: pnpm contracts:check

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: mymoneymap_test
          POSTGRES_USER: mymoneymap_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mymoneymap_test -d mymoneymap_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: '3000'
      APP_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://mymoneymap_test:synthetic-ci-only@127.0.0.1:5432/mymoneymap_test
      DATABASE_MIGRATION_URL: postgresql://mymoneymap_test:synthetic-ci-only@127.0.0.1:5432/mymoneymap_test
      DATABASE_TLS_MODE: disable
      DATABASE_POOL_MAX: '4'
      DATABASE_CONNECTION_TIMEOUT_MS: '2000'
      DATABASE_IDLE_TIMEOUT_MS: '10000'
      DATABASE_MAX_LIFETIME_SECONDS: '300'
      REDIS_URL: redis://127.0.0.1:6379
      LOG_LEVEL: fatal
      TRUST_PROXY: 'false'
      OPENAPI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:drift
      - run: pnpm test:integration

  postman-acceptance:
    name: Postman backend v1 acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: mymoneymap_postman
          POSTGRES_USER: mymoneymap_postman
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mymoneymap_postman -d mymoneymap_postman"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://mymoneymap_postman:synthetic-ci-only@127.0.0.1:5432/mymoneymap_postman
      DATABASE_MIGRATION_URL: postgresql://mymoneymap_postman:synthetic-ci-only@127.0.0.1:5432/mymoneymap_postman
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm postman:acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-backend-v1
          path: artifacts/newman

  security:
    name: Secret, dependency, SAST, and SBOM scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm security:sbom:check
      - uses: gitleaks/gitleaks-action@v2
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  container:
    name: Backend container and image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          load: true
          tags: mymoneymap-api:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mymoneymap-api:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - uses: anchore/sbom-action@v0.17.2
        with:
          image: mymoneymap-api:ci
          artifact-name: backend-container-sbom.spdx.json
